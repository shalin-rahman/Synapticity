name: Python CLI CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build_and_test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        # Assuming a requirements.txt exists for testing dependencies
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run Unit Tests
      # Assuming tests are located in a 'tests/' directory
      run: |
        pytest --cov=core --cov-report=xml

    - name: Linting Check (Optional but Recommended)
      # Placeholder for flake8 or black check
      run: |
        echo "Running linting checks..."
        # pip install flake8
        # flake8 . --max-complexity=10 --max-line-length=120

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build_and_test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: Production
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        pip install pytest

    - name: Build Package Artifact
      run: |
        python -m build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-dist
        path: dist/
        retention-days: 7
    
    # Example deployment step (e.g., publishing to PyPI or AWS S3)
    # - name: Publish to PyPI
    #   uses: pypa/gh-action-pypi-publish@release/discard-key
    #   with:
    #     user: ${{ secrets.PYPI_USERNAME }}
    #     password: ${{ secrets.PYPI_PASSWORD }}
